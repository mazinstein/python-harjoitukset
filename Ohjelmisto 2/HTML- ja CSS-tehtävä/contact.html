<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Contact information for Nord Coffee.">
    <title>Nord Coffee — Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <a class="logo" href="index.html">Nord Coffee</a>

            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </nav>
        </header>

        <main class="contact-page">
            <h1>Contact us</h1>

            <div class="contact-layout">
                <div class="contact-details">
                    <h2>Nord Coffee</h2>

                    <address>
                        Helsinki, Finland
                    </address>

                    <p>
                        <strong>Email:</strong><br>
                        <a href="mailto:hello@example.com">
                            hello@example.com
                        </a>
                    </p>

                    <h2>Opening hours</h2>

                    <p>
                        Monday–Friday: 8:00–18:00<br>
                        Saturday: 10:00–16:00<br>
                        Sunday: Closed
                    </p>

                    <p class="project-note">
                        Nord Coffee is a fictional café created
                        for a school project. Contact details
                        and opening hours are examples.
                    </p>
                </div>

                <img class="contact-image"
                     src="img/cafe.jpg"
                     alt="Café interior with hanging lamps and a menu board"
                     width="600"
                     height="400">
            </div>
        </main>
    </div>
</body>
</html>
